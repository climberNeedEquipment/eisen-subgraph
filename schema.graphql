type Swapper @entity(immutable: false) {
  id: ID! # This will be the sender's address
  swaps: [Swap!]! @derivedFrom(field: "sender")
  transactionCount: BigInt!
}

type Swap @entity(immutable: true) {
  id: ID!
  sender: Swapper!
  fromAssetId: Bytes!
  toAssetId: Bytes!
  receiver: Bytes!
  fromAmount: BigInt!
  toAmount: BigInt!
  expectedToAmount: BigInt!
  fee: BigInt!
  # block txn was included in
  blockNumber: BigInt!
  # timestamp txn was confirmed
  timestamp: BigInt!
  # gas used during txn execution
  gasUsed: BigInt!
  gasPrice: BigInt!
}

type Token @entity(immutable: false) {
  # token address
  id: ID!
  # token symbol
  symbol: String!
  # token name
  name: String!
  # token decimals
  decimals: BigInt!
  # transactions across all pools that include this token
  txCount: BigInt!
  # transactions across all pools that include this token
  sellVolume: BigInt!
  # transactions across all pools that include this token
  buyVolume: BigInt!
}
